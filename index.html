
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Wedding Invitation</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #17130e;
}

body {
  display: grid;
  place-items: center;
}

/* 9:16 MAIN STAGE */
#stage {
  position: relative;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  transform-origin: center center;
  background:
    radial-gradient(ellipse at center,
      #fffef9 0%,
      #f8f0df 65%,
      #e6d6b7 100%);
  perspective: 1800px;
}

/* LIGHT EFFECT */
.light {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 45%,
      transparent 25%,
      rgba(142, 105, 42, .12) 100%);
}

/* PHOTO SCENES */
.scene {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
}

.scene img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* SCENE 1 */
#scene1 {
  animation: sceneOne 15s linear forwards;
}

#scene1 .main-photo {
  animation: envelopeAppear 2.2s cubic-bezier(.2,.8,.2,1) both;
}

/*
  Duplicate image layer:
  Clip the upper scalloped envelope area
  and rotate it around its lower edge.
*/
.flap-layer {
  position: absolute;
  inset: 0;
  z-index: 3;
  transform-style: preserve-3d;
  transform-origin: 50% 28.5%;
  clip-path: polygon(
    12.5% 22%,
    16% 22.5%,
    22% 23%,
    28% 22.2%,
    35% 23%,
    42% 22.3%,
    49% 23%,
    56% 22.4%,
    63% 23%,
    70% 22.5%,
    78% 23%,
    81% 24%,
    81% 29%,
    12.5% 29%
  );
  animation: openFlap 2.5s 2.5s cubic-bezier(.65,0,.25,1) forwards;
}

.flap-layer img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

@keyframes envelopeAppear {
  from {
    opacity: 0;
    transform: translateY(100px) scale(.88);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes openFlap {
  0% {
    transform: rotateX(0deg);
    filter: brightness(1);
  }
  100% {
    transform: rotateX(-155deg);
    filter: brightness(.78);
  }
}

@keyframes sceneOne {
  0%, 20% { opacity: 1; }
  25%, 100% { opacity: 0; }
}

/* SCENE 2 : INVITATION SLIDES OUT */
#scene2 {
  animation: sceneTwo 15s linear forwards;
  transform-style: preserve-3d;
}

#scene2 .main-photo {
  animation: cardPullOut 3.2s 0s cubic-bezier(.16,.85,.25,1) both;
}

@keyframes cardPullOut {
  0% {
    opacity: 0;
    transform:
      translateY(180px)
      scale(.96)
      rotateX(12deg);
    filter: brightness(.8);
  }

  35% {
    opacity: 1;
  }

  75% {
    transform:
      translateY(-12px)
      scale(1.015)
      rotateX(-2deg);
  }

  100% {
    opacity: 1;
    transform:
      translateY(0)
      scale(1)
      rotateX(0deg);
    filter: brightness(1);
  }
}

@keyframes sceneTwo {
  0%, 20% { opacity: 0; }
  25%, 48% { opacity: 1; }
  53%, 100% { opacity: 0; }
}

/* SCENE 3 : FINAL PRESENTATION */
#scene3 {
  animation: sceneThree 15s linear forwards;
}

#scene3 .main-photo {
  animation: finalReveal 2.4s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes finalReveal {
  0% {
    opacity: 0;
    transform:
      perspective(1400px)
      rotateY(-18deg)
      scale(.88);
  }

  100% {
    opacity: 1;
    transform:
      perspective(1400px)
      rotateY(0deg)
      scale(1);
  }
}

@keyframes sceneThree {
  0%, 48% { opacity: 0; }
  53%, 100% { opacity: 1; }
}

/* GOLD FRAME */
.frame {
  position: absolute;
  inset: 48px;
  z-index: 20;
  border: 3px solid rgba(185,154,88,.8);
  outline: 1px solid rgba(185,154,88,.45);
  outline-offset: 12px;
  pointer-events: none;
}

.frame::after {
  content: "";
  position: absolute;
  inset: 25px;
  border: 1px solid rgba(185,154,88,.35);
}

/* DECORATIVE LIGHT */
.gold-dust {
  position: absolute;
  inset: 0;
  z-index: 15;
  pointer-events: none;
  opacity: .28;
  background-image:
    radial-gradient(#c7a65e 2px, transparent 3px),
    radial-gradient(#e6d3a0 2px, transparent 3px);
  background-size: 130px 150px, 90px 110px;
  animation: dustMove 12s linear infinite;
}

@keyframes dustMove {
  to {
    background-position: 0 -500px, 40px -440px;
  }
}

/* REPLAY BUTTON */
#replay {
  position: absolute;
  z-index: 50;
  bottom: 105px;
  left: 50%;
  transform: translateX(-50%);
  border: 1px solid #b99a58;
  background: rgba(255,252,244,.9);
  color: #806638;
  padding: 22px 55px;
  border-radius: 50px;
  font-size: 30px;
  letter-spacing: 3px;
  cursor: pointer;
  opacity: 0;
  animation: buttonShow 1s 13s forwards;
}

@keyframes buttonShow {
  to { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .gold-dust {
    animation: none;
  }
}
</style>
</head>

<body>

<div id="stage">

  <!-- SCENE 1: CLOSED ENVELOPE -->
  <section id="scene1" class="scene">
    <img
      class="main-photo"
      src="./1.jpg"
      alt="Wedding invitation envelope"
    >

    <!-- 3D FLAP LAYER -->
    <div class="flap-layer">
      <img src="./1.jpg" alt="">
    </div>
  </section>

  <!-- SCENE 2: CARD PULLING OUT -->
  <section id="scene2" class="scene">
    <img
      class="main-photo"
      src="./2.jpg"
      alt="Wedding invitation card sliding out"
    >
  </section>

  <!-- SCENE 3: FINAL VIEW -->
  <section id="scene3" class="scene">
    <img
      class="main-photo"
      src="./3.jpg"
      alt="Wedding invitation final view"
    >
  </section>

  <div class="gold-dust"></div>
  <div class="light"></div>
  <div class="frame"></div>

  <button id="replay" onclick="replayAnimation()">
    REPLAY
  </button>

</div>

<script>
const stage = document.getElementById("stage");

function fitStage() {
  const scale = Math.min(
    window.innerWidth / 1080,
    window.innerHeight / 1920
  );

  stage.style.transform = `scale(${scale})`;
}

function replayAnimation() {
  const scenes = document.querySelectorAll(".scene");
  const button = document.getElementById("replay");

  scenes.forEach(scene => {
    scene.style.animation = "none";
  });

  button.style.animation = "none";

  void stage.offsetWidth;

  scenes[0].style.animation = "sceneOne 15s linear forwards";
  scenes[1].style.animation = "sceneTwo 15s linear forwards";
  scenes[2].style.animation = "sceneThree 15s linear forwards";

  button.style.animation = "buttonShow 1s 13s forwards";

  const photos = document.querySelectorAll(".main-photo");

  photos[0].style.animation = "envelopeAppear 2.2s both";
  photos[1].style.animation = "cardPullOut 3.2s both";
  photos[2].style.animation = "finalReveal 2.4s both";

  const flap = document.querySelector(".flap-layer");
  flap.style.animation = "none";

  void flap.offsetWidth;

  flap.style.animation =
    "openFlap 2.5s 2.5s cubic-bezier(.65,0,.25,1) forwards";
}

window.addEventListener("resize", fitStage);
fitStage();
</script>

</body>
</html>
